[package]
name = "engine"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
mfce = { path = "../mfce" }
async-trait = "0.1"
ethers = { version = "2.0.14", default-features = false }
fs2 = "0.4"
futures-util = "0.3"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
rust_decimal = { version = "=1.36.0", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.113"
rmp-serde = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.20.1", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"
