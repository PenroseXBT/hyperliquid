[package]
name = "copytrade-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rust_decimal = { version = "=1.36.0", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.113"
rmp-serde = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "net", "sync", "time"] }
