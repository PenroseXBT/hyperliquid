[package]
name = "copytrade-signer"
version = "0.1.0"
edition = "2021"
publish = false
autobins = false

[dependencies]
async-trait = "0.1"
copytrade-core = { path = "../copytrade-core" }
ethers = { version = "2.0.14", default-features = false }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
rmp-serde = "1"
listenfd = "1"
rust_decimal = { version = "=1.36.0", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.113"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "sync", "time", "rt-multi-thread", "macros"] }
