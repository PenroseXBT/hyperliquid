name: Engine and MFCE boundary

on:
  push:
  pull_request:

jobs:
  engine-mfce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native model build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake libclang-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify engine authority, MFCE isolation, and regressions
        run: bash scripts/check_engine_boundary.sh
