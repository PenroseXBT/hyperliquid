[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"

[deploy]
startCommand = "/app/bin/run_su6_railway.sh"
region = "asia-southeast1-eqsg3a"
numReplicas = 1
# A fatal engine exit is a capital-safety latch. Recovery requires an explicit
# operator restart after the persisted failure has been diagnosed.
restartPolicyType = "NEVER"
restartPolicyMaxRetries = 1
overlapSeconds = 0
drainingSeconds = 300

[deploy.multiRegionConfig.asia-southeast1-eqsg3a]
numReplicas = 1
