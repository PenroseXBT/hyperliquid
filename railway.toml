[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"

[deploy]
startCommand = "python3 /app/bin/hl_bot.py supervise"
region = "asia-southeast1-eqsg3a"
numReplicas = 1
# Supervisor keeps telemetry online while the engine restarts under a pause.
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 100
overlapSeconds = 0
drainingSeconds = 90

[deploy.multiRegionConfig.asia-southeast1-eqsg3a]
numReplicas = 1
